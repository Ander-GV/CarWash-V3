version: '3.8'

services:
  # ==========================================
  # 1. BASE DE DATOS POSTGRESQL
  # ==========================================
  postgres:
    image: postgres:16-alpine
    container_name: carwash_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-carwash_db}
    ports:
      - "5432:5432"
    volumes:
      - carwash_postgres_data:/var/lib/postgresql/data
    networks:
      - carwash_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d carwash_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ==========================================
  # 2. MICROSERVICIO PYTHON IA (FASTAPI)
  # ==========================================
  backend-python:
    build:
      context: ./backend-ml-python
      dockerfile: Dockerfile
    container_name: carwash_python_ml
    restart: unless-stopped
    ports:
      - "8000:8000"
    networks:
      - carwash_network

  # ==========================================
  # 3. BACKEND NESTJS + WEBSOCKETS + ARDUINO
  # ==========================================
  backend-nest:
    build:
      context: ./backend-nest
      dockerfile: Dockerfile
    container_name: carwash_backend_nest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      backend-python:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-carwash_db}
      JWT_SECRET: ${JWT_SECRET:-CARWASH_SUPER_SECURE_JWT_SECRET_2026}
      JWT_EXPIRES_IN: 12h
      WOMPI_PUBLIC_KEY: ${WOMPI_PUBLIC_KEY:-pub_test_Q5yDA9xoKdePCSC1WrU9AC9V01WA7rOo}
      WOMPI_INTEGRITY_SECRET: ${WOMPI_INTEGRITY_SECRET:-test_integrity_1234567890abcdef}
      WOMPI_EVENTS_SECRET: ${WOMPI_EVENTS_SECRET:-test_events_secret_123456}
      PYTHON_ML_URL: http://backend-python:8000
      ARDUINO_PORT: ${ARDUINO_PORT:-COM3}
      ARDUINO_WIFI_IP: ${ARDUINO_WIFI_IP:-}
    ports:
      - "3000:3000"
    networks:
      - carwash_network

  # ==========================================
  # 4. FRONTEND REACT (KIOSCO & BACKOFFICE)
  # ==========================================
  frontend-react:
    build:
      context: ./frontend-react
      dockerfile: Dockerfile
    container_name: carwash_frontend_react
    restart: unless-stopped
    depends_on:
      - backend-nest
    ports:
      - "80:80"
      - "5173:80"
    networks:
      - carwash_network

networks:
  carwash_network:
    driver: bridge

volumes:
  carwash_postgres_data:
    driver: local
